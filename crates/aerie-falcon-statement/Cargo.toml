[package]
name = "aerie-falcon-statement"
version.workspace = true
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Falcon statement layer: byte-bound records, protocol modes, fixtures, production ingestion"

[features]
default = []
parallel = ["dep:rayon", "aerie-falcon-native/parallel"]
honest-vectors = ["dep:fn-dsa"]

[dependencies]
akita-algebra = { workspace = true }
aerie-falcon-native = { workspace = true }
fn-dsa = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
shake = { workspace = true }
tracing = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
