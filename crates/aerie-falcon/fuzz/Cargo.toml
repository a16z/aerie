# Standalone fuzz sub-workspace (same pattern as crates/aerie-falcon-native/fuzz): the
# empty [workspace] table keeps it out of the root workspace so the
# nightly-only libfuzzer dependency never enters the main build graph.
[workspace]

[package]
name = "aerie-falcon-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Verifier-side graph only: no rayon or honest vectors. The feature exposes
# the wire decoder to this non-workspace fuzz target.
aerie-falcon = { path = "..", default-features = false, features = [
  "adversarial-internals",
] }

[[bin]]
name = "wire_pcs_proof"
path = "fuzz_targets/wire_pcs_proof.rs"
test = false
doc = false
