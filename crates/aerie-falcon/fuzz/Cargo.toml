# Standalone fuzz sub-workspace (same pattern as crates/aerie-falcon-native/fuzz): the
# empty [workspace] table keeps it out of the root workspace so the
# nightly-only libfuzzer dependency never enters the main build graph.
[workspace]

[package]
name = "aerie-falcon-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["a16z and LayerZero Labs"]
repository = "https://github.com/a16z/aerie"
homepage = "https://github.com/a16z/aerie"
publish = false
description = "Aerie fuzzes the Falcon proof wire decoder and verifier inputs."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Verifier-safe common graph with serial execution and no signer. The feature
# exposes the wire decoder to this non-workspace fuzz target.
aerie-falcon = { path = "..", default-features = false, features = [
  "internals",
] }

[[bin]]
name = "wire_pcs_proof"
path = "fuzz_targets/wire_pcs_proof.rs"
test = false
doc = false
