name: Catalog drift

# The committed aerie-pcs-config fold-schedule catalogs (crates/aerie-pcs-config/src/schedules)
# are generated by the Akita planner. Each shard freshly plans a cost-balanced
# slice of the requested rows and fails on any byte difference from the
# checked-in row, so a planner or policy change cannot leave the tables stale.
# Every shard passing is equivalent to full regeneration reproducing the
# committed bytes; `verify_shard` in the regeneration test states the argument.
# Path-filtered to the artifact's inputs, and weekly; not a required check.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-drift.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/aerie-pcs-config/Cargo.toml"
      - "crates/aerie-pcs-config/src/configs.rs"
      - "crates/aerie-pcs-config/src/schedules/**"
      - "crates/aerie-pcs-config/tests/schedule_catalog_regen.rs"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/catalog-drift.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/aerie-pcs-config/Cargo.toml"
      - "crates/aerie-pcs-config/src/configs.rs"
      - "crates/aerie-pcs-config/src/schedules/**"
      - "crates/aerie-pcs-config/tests/schedule_catalog_regen.rs"
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  AKITA_SCHEDULE_GEN_JOBS: "2"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  aerie-pcs-config:
    name: Verify aerie-pcs-config catalog shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Six shards estimate at most 15 minutes of two-worker planning each on
    # the 2026-09-22 two-core timings, plus the build.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      # Every shard builds the same test binary; one shard saves the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: catalog-drift-aerie-pcs-config
          save-if: ${{ matrix.shard == 0 }}
      # The generated-catalog feature is off, as for regeneration. The
      # non-ignored tests check that the artifacts hold exactly the requested
      # rows, re-encode to their own bytes, and that the shards cover them.
      - name: Check catalog coverage and shard partition
        if: matrix.shard == 0
        run: >-
          cargo test --release --locked -p aerie-pcs-config --no-default-features
          --test schedule_catalog_regen
      - name: Verify catalog shard
        env:
          AERIE_CATALOG_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: >-
          cargo test --release --locked -p aerie-pcs-config --no-default-features
          --test schedule_catalog_regen -- --ignored --exact verify_shard --nocapture

  catalog-drift:
    name: Catalog drift
    if: always()
    needs: aerie-pcs-config
    runs-on: ubuntu-latest
    steps:
      - name: Require every catalog shard to pass
        env:
          SHARDS: ${{ needs.aerie-pcs-config.result }}
        run: |
          echo "aerie-pcs-config catalog shards: $SHARDS"
          test "$SHARDS" = success
