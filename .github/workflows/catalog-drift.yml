name: Catalog drift

# The committed aerie-pcs-config fold-schedule catalogs (crates/aerie-pcs-config/src/schedules)
# are generated by the Akita planner. Each shard freshly plans a cost-balanced
# slice of the requested rows and fails on any byte difference from the
# checked-in row, so a planner or policy change cannot leave the tables stale.
# Every shard passing is equivalent to full regeneration reproducing the
# committed bytes; `verify_shard` in the regeneration test states the argument.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always
  AKITA_SCHEDULE_GEN_JOBS: "2"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect catalog inputs
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] || \
             [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A force-pushed base can leave BASE_SHA unreachable; verify the catalog then.
          if ! git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/catalog-changed-paths"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/catalog-drift.yml|Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/aerie-pcs-config/*)
                echo "required=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < "$RUNNER_TEMP/catalog-changed-paths"
          echo "required=false" >> "$GITHUB_OUTPUT"

  aerie-pcs-config:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: Verify aerie-pcs-config catalog shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      # Every shard builds the same test binary; one shard saves the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: catalog-drift-aerie-pcs-config
          save-if: ${{ matrix.shard == 0 }}
      # The generated-catalog feature is off, as for regeneration. The
      # non-ignored tests check that the artifacts hold exactly the requested
      # rows, re-encode to their own bytes, and that the shards cover them.
      - name: Check catalog coverage and shard partition
        if: matrix.shard == 0
        run: >-
          cargo test --release --locked -p aerie-pcs-config --no-default-features
          --test schedule_catalog_regen
      - name: Verify catalog shard
        env:
          AERIE_CATALOG_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: >-
          cargo test --release --locked -p aerie-pcs-config --no-default-features
          --test schedule_catalog_regen -- --ignored --exact verify_shard --nocapture

  catalog-drift:
    name: Catalog drift
    if: always()
    needs: [changes, aerie-pcs-config]
    runs-on: ubuntu-latest
    steps:
      - name: Require every catalog shard to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          SHARDS: ${{ needs.aerie-pcs-config.result }}
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [ "$REQUIRED" = false ]; then
            echo "No catalog inputs changed"
            test "$SHARDS" = skipped
            exit 0
          fi
          test "$REQUIRED" = true
          echo "aerie-pcs-config catalog shards: $SHARDS"
          test "$SHARDS" = success
